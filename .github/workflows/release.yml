# CD (continuous delivery): pushing a version tag such as v0.2.0 builds the Windows package from this exact
# source code, tests it, and publishes a GitHub release with the zip and the notes from CHANGELOG.md.
#   git tag v0.2.0
#   git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The tag must match the VERSION file
        shell: pwsh
        run: |
          $v = "v" + (Get-Content VERSION -Raw).Trim()
          if ($v -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match VERSION ($v)" }
      - name: Run the tests first
        run: python tests/test_local.py
      - name: Install the packaging tools
        run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - name: Build Weisy-daily-desk.exe, zip it and smoke-test the zip
        run: python tools/package.py
      - name: Release notes from CHANGELOG.md
        run: python tools/release_notes.py ${{ github.ref_name }} build/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/Weisy-${{ github.ref_name }}-windows.zip --title "${{ github.ref_name }}" --notes-file build/notes.md
